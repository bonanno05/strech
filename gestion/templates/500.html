<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error del sistema — Strech</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f8f9fa;
            color: #1b2a38;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        .caja {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 40px;
            max-width: 480px;
            text-align: center;
        }
        .codigo { font-size: 40px; color: #6c757d; margin: 0 0 8px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #6c757d; margin: 0 0 24px; }
        a {
            display: inline-block;
            background: #2b5f8e;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="caja">
        <p class="codigo">500</p>
        <h1>Algo falló de nuestro lado</h1>
        <p>
            El error quedó registrado. Probá de nuevo en un rato;
            si sigue pasando, avisale al vendedor.
        </p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
